&lt;body&gt;
&lt;div id=&quot;bp-online-roadmap&quot;&gt;
  &lt;style&gt;

  &lt;/style&gt;

  &lt;section class=&quot;roadmap-meta&quot; aria-label=&quot;Roadmap overview&quot;&gt;
    &lt;div class=&quot;viz-grid&quot;&gt;

        &lt;span class=&quot;text-small&quot;&gt;6 progressive stages&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;card viz-stat&quot;&gt;
        &lt;span class=&quot;text-muted&quot;&gt;Core reading spine&lt;/span&gt;
        &lt;span class=&quot;viz-stat-value&quot;&gt;15&lt;/span&gt;
        &lt;span class=&quot;text-small&quot;&gt;Read the spine, then choose a mechanism branch&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;card viz-stat&quot;&gt;
        &lt;span class=&quot;text-muted&quot;&gt;Evidence cutoff&lt;/span&gt;
        &lt;span class=&quot;viz-stat-value&quot;&gt;2026-07&lt;/span&gt;
        &lt;span class=&quot;text-small&quot;&gt;Searched through 2026-07-15; target-directed, not exhaustive&lt;/span&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;viz-row legend text-small&quot; aria-label=&quot;Legend&quot;&gt;
      &lt;span class=&quot;legend-item&quot;&gt;&lt;span class=&quot;requirement-icon&quot; aria-hidden=&quot;true&quot;&gt;●&lt;/span&gt;Core reading&lt;/span&gt;
      &lt;span class=&quot;legend-item&quot;&gt;&lt;span class=&quot;requirement-icon&quot; aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;Optional branch&lt;/span&gt;
      &lt;span class=&quot;legend-item&quot;&gt;&lt;span class=&quot;requirement-icon&quot; aria-hidden=&quot;true&quot;&gt;✦&lt;/span&gt;Frontier tracking&lt;/span&gt;
      &lt;span class=&quot;legend-item&quot;&gt;&lt;span class=&quot;domain-swatch&quot; style=&quot;--series:var(--viz-series-1)&quot;&gt;&lt;/span&gt;Computational foundations&lt;/span&gt;
      &lt;span class=&quot;legend-item&quot;&gt;&lt;span class=&quot;domain-swatch&quot; style=&quot;--series:var(--viz-series-2)&quot;&gt;&lt;/span&gt;Synaptic plasticity&lt;/span&gt;
      &lt;span class=&quot;legend-item&quot;&gt;&lt;span class=&quot;domain-swatch&quot; style=&quot;--series:var(--viz-series-3)&quot;&gt;&lt;/span&gt;Spatial credit / predictive coding&lt;/span&gt;
      &lt;span class=&quot;legend-item&quot;&gt;&lt;span class=&quot;domain-swatch&quot; style=&quot;--series:var(--viz-series-4)&quot;&gt;&lt;/span&gt;Temporal credit / SNNs&lt;/span&gt;
      &lt;span class=&quot;legend-item&quot;&gt;&lt;span class=&quot;domain-swatch&quot; style=&quot;--series:var(--viz-series-5)&quot;&gt;&lt;/span&gt;Online / continual learning&lt;/span&gt;
      &lt;span class=&quot;legend-item&quot;&gt;&lt;span class=&quot;domain-swatch&quot; style=&quot;--series:var(--viz-series-6)&quot;&gt;&lt;/span&gt;Convergence frontier&lt;/span&gt;
    &lt;/div&gt;
    &lt;p class=&quot;text-small text-muted&quot;&gt;Select any paper to see a concise review, its relevance to the target field, project fit, and an archival record. The highlighted path is the 15-paper core spine; selecting a node also reveals its direct prerequisites. Evidence is drawn primarily from publisher or proceedings abstracts and selected full texts. The summaries are curator interpretations, and a 2025–2026 frontier label does not imply independent replication.&lt;/p&gt;
  &lt;/section&gt;

  &lt;section class=&quot;map-wrap&quot; id=&quot;bp-map-wrap&quot; aria-label=&quot;Paper dependency map&quot;&gt;
    &lt;svg class=&quot;edge-layer&quot; id=&quot;bp-edge-layer&quot; role=&quot;img&quot; aria-label=&quot;Recommended reading dependencies between papers&quot;&gt;&lt;/svg&gt;
    &lt;div id=&quot;bp-stage-container&quot;&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;card selected-detail&quot; id=&quot;bp-selected-detail&quot; aria-live=&quot;polite&quot;&gt;
    &lt;div class=&quot;detail-head&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;detail-meta text-small&quot; id=&quot;bp-detail-meta&quot;&gt;&lt;/div&gt;
        &lt;h3 class=&quot;detail-title&quot; id=&quot;bp-detail-title&quot;&gt;&lt;/h3&gt;
        &lt;div class=&quot;text-small text-muted&quot; id=&quot;bp-detail-authors&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;span class=&quot;viz-badge&quot; id=&quot;bp-detail-fit&quot;&gt;&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;detail-grid&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;detail-label text-small&quot;&gt;Brief review&lt;/div&gt;
        &lt;p id=&quot;bp-detail-summary&quot;&gt;&lt;/p&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;detail-label text-small&quot;&gt;Relevance to biologically plausible online learning&lt;/div&gt;
        &lt;p id=&quot;bp-detail-meaning&quot;&gt;&lt;/p&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;detail-label text-small&quot;&gt;Caveats to keep in view&lt;/div&gt;
        &lt;p id=&quot;bp-detail-caveat&quot;&gt;&lt;/p&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;div class=&quot;detail-label text-small&quot;&gt;Recommended prerequisites&lt;/div&gt;
        &lt;p class=&quot;prereq-list&quot; id=&quot;bp-detail-prereqs&quot;&gt;&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;detail-actions&quot;&gt;
      &lt;span class=&quot;text-small text-muted&quot; id=&quot;bp-detail-order&quot;&gt;&lt;/span&gt;
      &lt;a class=&quot;btn&quot; id=&quot;bp-detail-link&quot; href=&quot;#&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;&lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;Open paper record&lt;/a&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;bp-online-roadmap&#x27;);
      const stageContainer = root.querySelector(&#x27;#bp-stage-container&#x27;);
      const mapWrap = root.querySelector(&#x27;#bp-map-wrap&#x27;);
      const edgeLayer = root.querySelector(&#x27;#bp-edge-layer&#x27;);

      const stages = [
        { id: 0, label: &#x27;Foundations: define the problem&#x27;, size: &#x27;Very large field · Top 5&#x27;, note: &#x27;BP, local rules, interference, and biological critiques&#x27; },
        { id: 1, label: &#x27;How do local synapses learn?&#x27;, size: &#x27;Large field · Top 4&#x27;, note: &#x27;STDP → eligibility → BTSP&#x27; },
        { id: 2, label: &#x27;How does error cross layers?&#x27;, size: &#x27;Largest prerequisite branch · Top 9&#x27;, note: &#x27;Feedback, dendrites, energy-based models, and predictive coding&#x27; },
        { id: 3, label: &#x27;How does error cross time?&#x27;, size: &#x27;Large field · Top 6&#x27;, note: &#x27;Causal online SNNs and bounded state&#x27; },
        { id: 4, label: &#x27;How can a system keep learning without forgetting or losing plasticity?&#x27;, size: &#x27;Large field · Top 6&#x27;, note: &#x27;Protocols, continual streams, and preserving plasticity&#x27; },
        { id: 5, label: &#x27;2024–2026 convergence frontier&#x27;, size: &#x27;Emerging intersection · Top 5&#x27;, note: &#x27;Joint spatial, temporal, and stability constraints&#x27; }
      ];

      const domains = {
        foundation: { label: &#x27;Computational foundations&#x27;, color: &#x27;var(--viz-series-1)&#x27;, icon: &#x27;network&#x27; },
        plasticity: { label: &#x27;Synaptic plasticity&#x27;, color: &#x27;var(--viz-series-2)&#x27;, icon: &#x27;activity&#x27; },
        spatial: { label: &#x27;Spatial credit / predictive coding&#x27;, color: &#x27;var(--viz-series-3)&#x27;, icon: &#x27;git-branch&#x27; },
        spiking: { label: &#x27;Temporal credit / SNNs&#x27;, color: &#x27;var(--viz-series-4)&#x27;, icon: &#x27;waves&#x27; },
        continual: { label: &#x27;Online / continual learning&#x27;, color: &#x27;var(--viz-series-5)&#x27;, icon: &#x27;refresh-cw&#x27; },
        frontier: { label: &#x27;Convergence frontier&#x27;, color: &#x27;var(--viz-series-6)&#x27;, icon: &#x27;sparkles&#x27; }
      };

      const requirements = {
        core: { label: &#x27;Core reading&#x27;, icon: &#x27;circle-check-big&#x27; },
        branch: { label: &#x27;Optional branch&#x27;, icon: &#x27;git-fork&#x27; },
        frontier: { label: &#x27;Frontier tracking&#x27;, icon: &#x27;sparkles&#x27; }
      };

      const papers = [
        { id:&#x27;P031&#x27;, stage:0, year:1986, short:&#x27;Backpropagation&#x27;, title:&#x27;Learning Representations by Back-Propagating Errors&#x27;, authors:&#x27;Rumelhart, Hinton &amp; Williams · Nature&#x27;, domain:&#x27;foundation&#x27;, req:&#x27;core&#x27;, summary:&#x27;Backpropagation assigns output errors backward through a multilayer network to update each weight, allowing hidden units to learn internal representations. It is the common computational reference for later alternatives to BP.&#x27;, meaning:&#x27;Understanding the credit-assignment problem it solves lets the reader assess which capabilities an alternative retains and which assumptions it relaxes or replaces.&#x27;, caveat:&#x27;Algorithmic effectiveness does not show that the brain implements BP; this paper also does not study online continual learning.&#x27;, fit:&#x27;Required baseline&#x27;, prereqs:[], url:&#x27;https://doi.org/10.1038/323533a0&#x27; },
        { id:&#x27;P032&#x27;, stage:0, year:1982, short:&#x27;Oja’s rule&#x27;, title:&#x27;Simplified Neuron Model as a Principal Component Analyzer&#x27;, authors:&#x27;Erkki Oja · Journal of Mathematical Biology&#x27;, domain:&#x27;foundation&#x27;, req:&#x27;core&#x27;, summary:&#x27;When vector inputs are treated as a stochastic process, this simplified neuron tends toward extracting a principal component of its input.&#x27;, meaning:&#x27;For a reader with a general scientific background, it is a compact numerical starting point for understanding self-organized structure extraction from a continuous stream.&#x27;, caveat:&#x27;It addresses shallow unsupervised representation learning, not deep supervised credit assignment, and it does not by itself prevent catastrophic forgetting.&#x27;, fit:&#x27;High two-week feasibility&#x27;, prereqs:[], url:&#x27;https://doi.org/10.1007/BF00275687&#x27; },
        { id:&#x27;P033&#x27;, stage:0, year:1980, short:&#x27;Cognitive-code framing&#x27;, title:&#x27;How Does a Brain Build a Cognitive Code?&#x27;, authors:&#x27;Stephen Grossberg · Psychological Review&#x27;, domain:&#x27;foundation&#x27;, req:&#x27;branch&#x27;, summary:&#x27;A historical theoretical paper on how a brain might construct a cognitive code.&#x27;, meaning:&#x27;Use it as optional context for the problem framing of the 1980s. This roadmap does not infer specific ART mechanisms from the title alone.&#x27;, caveat:&#x27;It is not an implementation target for this project. Any use of a specific mechanism requires separate full-text evidence extraction.&#x27;, fit:&#x27;Historical optional&#x27;, prereqs:[], url:&#x27;https://doi.org/10.1037/0033-295X.87.1.1&#x27; },
        { id:&#x27;P034&#x27;, stage:0, year:1989, short:&#x27;Catastrophic interference&#x27;, title:&#x27;Catastrophic Interference in Connectionist Networks: The Sequential Learning Problem&#x27;, authors:&#x27;McCloskey &amp; Cohen · Psychology of Learning and Motivation&#x27;, domain:&#x27;foundation&#x27;, req:&#x27;core&#x27;, summary:&#x27;The paper shows that when a network learns new material sequentially, new weight updates can rapidly damage previously acquired solutions; this is not simply a capacity shortfall.&#x27;, meaning:&#x27;It requires the project to report current-task learning separately from retention of earlier tasks.&#x27;, caveat:&#x27;The classic demonstrations are small; modern deep networks can also exhibit a distinct loss of plasticity.&#x27;, fit:&#x27;Protocol essential&#x27;, prereqs:[&#x27;P031&#x27;], url:&#x27;https://doi.org/10.1016/S0079-7421(08)60536-8&#x27; },
        { id:&#x27;P035&#x27;, stage:0, year:1989, short:&#x27;Crick commentary&#x27;, title:&#x27;The Recent Excitement About Neural Networks&#x27;, authors:&#x27;Francis Crick · Nature&#x27;, domain:&#x27;foundation&#x27;, req:&#x27;branch&#x27;, summary:&#x27;A 1989 Nature commentary on the neural-network resurgence of its period.&#x27;, meaning:&#x27;It supplies historical context; P041 and P002 provide the modern map of biological objections and proposed responses.&#x27;, caveat:&#x27;This roadmap does not infer a specific weight-transport argument from the article title.&#x27;, fit:&#x27;Brief optional&#x27;, prereqs:[&#x27;P031&#x27;], url:&#x27;https://pubmed.ncbi.nlm.nih.gov/2911347/&#x27; },

        { id:&#x27;P036&#x27;, stage:1, year:1998, short:&#x27;STDP experiment&#x27;, title:&#x27;Synaptic Modifications in Cultured Hippocampal Neurons&#x27;, authors:&#x27;Bi &amp; Poo · Journal of Neuroscience&#x27;, domain:&#x27;plasticity&#x27;, req:&#x27;core&#x27;, summary:&#x27;The experiments show that synaptic strengthening or weakening depends on the relative timing of pre- and postsynaptic firing, initial synaptic strength, and cell type.&#x27;, meaning:&#x27;It turns coincident activation into a measurable millisecond-scale local timing rule and provides an experimental starting point for SNN learning and eligibility traces.&#x27;, caveat:&#x27;Local correlation alone supplies no deep task objective and cannot by itself solve credit assignment across layers.&#x27;, fit:&#x27;Mechanism essential&#x27;, prereqs:[&#x27;P032&#x27;], url:&#x27;https://pubmed.ncbi.nlm.nih.gov/9852584/&#x27; },
        { id:&#x27;P024&#x27;, stage:1, year:2018, short:&#x27;Eligibility traces&#x27;, title:&#x27;Eligibility Traces and Plasticity on Behavioral Time Scales&#x27;, authors:&#x27;Gerstner et al. · Frontiers in Neural Circuits&#x27;, domain:&#x27;plasticity&#x27;, req:&#x27;core&#x27;, summary:&#x27;This review describes neo-Hebbian three-factor rules: a local synaptic event leaves an eligibility trace whose consolidation is later controlled by reward, error, or neuromodulatory signals.&#x27;, meaning:&#x27;It is the conceptual bridge from STDP to e-prop and AGMP, explaining how a local synapse can wait for a delayed teaching signal.&#x27;, caveat:&#x27;The third factor may be broadcast globally; temporal locality is not the same as complete spatial locality.&#x27;, fit:&#x27;Mechanism essential&#x27;, prereqs:[&#x27;P036&#x27;], url:&#x27;https://www.frontiersin.org/journals/neural-circuits/articles/10.3389/fncir.2018.00053/full&#x27; },
        { id:&#x27;P037&#x27;, stage:1, year:2017, short:&#x27;BTSP discovery&#x27;, title:&#x27;Behavioral Time Scale Synaptic Plasticity Underlies CA1 Place Fields&#x27;, authors:&#x27;Bittner et al. · Science&#x27;, domain:&#x27;plasticity&#x27;, req:&#x27;branch&#x27;, summary:&#x27;The study reports that CA1 place fields can arise from strong, rapid synaptic changes associated with plateau potentials over seconds-long windows, rather than classic millisecond-scale Hebbian or STDP mechanisms.&#x27;, meaning:&#x27;It opens a biological branch toward one-shot learning on behavioral timescales.&#x27;, caveat:&#x27;This is evidence for a hippocampal mechanism, not a general algorithm that directly trains arbitrary deep networks.&#x27;, fit:&#x27;BTSP branch&#x27;, prereqs:[&#x27;P036&#x27;], url:&#x27;https://doi.org/10.1126/science.aan3846&#x27; },
        { id:&#x27;P038&#x27;, stage:1, year:2025, short:&#x27;BTSP one-shot memory&#x27;, title:&#x27;A Simple Model for BTSP Provides Content-Addressable Memory with Binary Synapses and One-Shot Learning&#x27;, authors:&#x27;Wu &amp; Maass · Nature Communications&#x27;, domain:&#x27;plasticity&#x27;, req:&#x27;frontier&#x27;, summary:&#x27;The paper abstracts BTSP into a content-addressable memory with binary synapses, demonstrating online one-shot learning and recall from partial cues.&#x27;, meaning:&#x27;It turns experimental BTSP into an algorithmic object that can be implemented, compared, and extended.&#x27;, caveat:&#x27;The model is closer to associative memory than general deep supervised classification; first decide whether the project question requires this form of memory.&#x27;, fit:&#x27;Optional in two weeks&#x27;, prereqs:[&#x27;P037&#x27;], url:&#x27;https://www.nature.com/articles/s41467-024-55563-6&#x27; },

        { id:&#x27;P025&#x27;, stage:2, year:2016, short:&#x27;Feedback alignment&#x27;, title:&#x27;Random Synaptic Feedback Weights Support Error Backpropagation for Deep Learning&#x27;, authors:&#x27;Lillicrap et al. · Nature Communications&#x27;, domain:&#x27;spatial&#x27;, req:&#x27;branch&#x27;, summary:&#x27;The method replaces exact transposes of forward weights with fixed random feedback weights, while the network learns representations that align with the feedback directions.&#x27;, meaning:&#x27;It shows that addressing weight symmetry need not require exact weight transport, establishing an important branch in spatial credit assignment.&#x27;, caveat:&#x27;The method still uses global error information, differentiable computation, and a training procedure; it does not automatically provide online or continual learning.&#x27;, fit:&#x27;Comparator branch&#x27;, prereqs:[&#x27;P031&#x27;,&#x27;P035&#x27;], url:&#x27;https://www.nature.com/articles/ncomms13276&#x27; },
        { id:&#x27;P039&#x27;, stage:2, year:2017, short:&#x27;Segregated dendrites&#x27;, title:&#x27;Towards Deep Learning with Segregated Dendrites&#x27;, authors:&#x27;Guerguiev, Lillicrap &amp; Richards · eLife&#x27;, domain:&#x27;spatial&#x27;, req:&#x27;branch&#x27;, summary:&#x27;In multicompartment neurons, sensory input and higher-order feedback enter separate dendritic compartments, and local voltage changes provide an approximation to a target.&#x27;, meaning:&#x27;The model grounds an abstract feedback signal in a concrete cortical cell structure that can be evaluated mechanistically.&#x27;, caveat:&#x27;It depends on phase or state comparisons and specific circuit assumptions; structural plausibility does not by itself establish system-level validation.&#x27;, fit:&#x27;Dendritic branch&#x27;, prereqs:[&#x27;P025&#x27;], url:&#x27;https://elifesciences.org/articles/22901&#x27; },
        { id:&#x27;P028&#x27;, stage:2, year:2017, short:&#x27;Equilibrium propagation&#x27;, title:&#x27;Equilibrium Propagation: Bridging the Gap between Energy-Based Models and Backpropagation&#x27;, authors:&#x27;Scellier &amp; Bengio · Frontiers in Computational Neuroscience&#x27;, domain:&#x27;spatial&#x27;, req:&#x27;branch&#x27;, summary:&#x27;An energy-based network first settles freely and is then weakly nudged; local differences between the two equilibria determine parameter updates.&#x27;, meaning:&#x27;It represents a route that obtains credit through network dynamics rather than an explicit backward computational graph.&#x27;, caveat:&#x27;The two phases and convergence time are central costs; continuous-time hardware does not automatically make the method real-time or online.&#x27;, fit:&#x27;Theory branch&#x27;, prereqs:[&#x27;P031&#x27;], url:&#x27;https://www.frontiersin.org/journals/computational-neuroscience/articles/10.3389/fncom.2017.00024/full&#x27; },
        { id:&#x27;P011&#x27;, stage:2, year:2017, short:&#x27;PC ≈ BP&#x27;, title:&#x27;An Approximation of the Error Backpropagation Algorithm in a Predictive Coding Network&#x27;, authors:&#x27;Whittington &amp; Bogacz · Neural Computation&#x27;, domain:&#x27;spatial&#x27;, req:&#x27;core&#x27;, summary:&#x27;The paper constructs a predictive-coding network whose neural activities converge by minimizing error and whose weight updates approximate BP under specified conditions.&#x27;, meaning:&#x27;It is the core algorithmic foundation for the associated project’s predictive-coding branch.&#x27;, caveat:&#x27;The equivalence depends on architecture, error units, initialization, and update order; the mathematical construction should not be treated directly as a cortical fact.&#x27;, fit:&#x27;PC essential&#x27;, prereqs:[&#x27;P031&#x27;], url:&#x27;https://doi.org/10.1162/NECO_a_00949&#x27; },
        { id:&#x27;P040&#x27;, stage:2, year:2018, short:&#x27;Dendritic microcircuits&#x27;, title:&#x27;Dendritic Cortical Microcircuits Approximate the Backpropagation Algorithm&#x27;, authors:&#x27;Sacramento et al. · NeurIPS&#x27;, domain:&#x27;spatial&#x27;, req:&#x27;branch&#x27;, summary:&#x27;The model combines multicompartment pyramidal cells, inhibitory interneurons, and local plasticity into a cortical microcircuit that approximates deep BP.&#x27;, meaning:&#x27;It shows how dendrites and circuits might turn hidden-layer errors into locally available quantities.&#x27;, caveat:&#x27;The circuit is complex and the training conditions are specialized, making it a high-risk primary implementation for a two-week project.&#x27;, fit:&#x27;Advanced optional&#x27;, prereqs:[&#x27;P039&#x27;,&#x27;P011&#x27;], url:&#x27;https://arxiv.org/abs/1810.11393&#x27; },
        { id:&#x27;P026&#x27;, stage:2, year:2018, short:&#x27;Scalability audit&#x27;, title:&#x27;Assessing the Scalability of Biologically-Motivated Deep Learning Algorithms and Architectures&#x27;, authors:&#x27;Bartunov et al. · NeurIPS&#x27;, domain:&#x27;spatial&#x27;, req:&#x27;core&#x27;, summary:&#x27;The study compares biologically motivated alternatives on harder datasets and locally connected architectures, finding that many methods successful on simple tasks degrade substantially.&#x27;, meaning:&#x27;It is the roadmap’s guard against overgeneralization: fixing one biological objection does not guarantee effective deep learning.&#x27;, caveat:&#x27;The negative findings apply to the tested algorithms and implementations of that period; they do not show that every biologically motivated method fails to scale.&#x27;, fit:&#x27;Critical essential&#x27;, prereqs:[&#x27;P025&#x27;,&#x27;P028&#x27;,&#x27;P011&#x27;], url:&#x27;https://proceedings.neurips.cc/paper_files/paper/2018/hash/63c3ddcc7b23daa1e42dc41f9a44a873-Abstract.html&#x27; },
        { id:&#x27;P041&#x27;, stage:2, year:2019, short:&#x27;Brain BP theories&#x27;, title:&#x27;Theories of Error Back-Propagation in the Brain&#x27;, authors:&#x27;Whittington &amp; Bogacz · Trends in Cognitive Sciences&#x27;, domain:&#x27;spatial&#x27;, req:&#x27;core&#x27;, summary:&#x27;The review compares how predictive coding, equilibrium or target propagation, dendrites, and feedback circuits might convert global objectives into signals usable by local synapses.&#x27;, meaning:&#x27;For a reader with a general scientific background, it is the most compact mechanism map to read before entering a technical branch.&#x27;, caveat:&#x27;The review organizes theories; it does not establish any one mechanism as the algorithm used by the brain.&#x27;, fit:&#x27;Overview essential&#x27;, prereqs:[&#x27;P025&#x27;,&#x27;P028&#x27;,&#x27;P011&#x27;], url:&#x27;https://doi.org/10.1016/j.tics.2018.12.005&#x27; },
        { id:&#x27;P002&#x27;, stage:2, year:2020, short:&#x27;Backprop and the brain&#x27;, title:&#x27;Backpropagation and the Brain&#x27;, authors:&#x27;Lillicrap et al. · Nature Reviews Neuroscience&#x27;, domain:&#x27;spatial&#x27;, req:&#x27;core&#x27;, summary:&#x27;The review decomposes the biological challenges of BP and discusses how differences in feedback activity, alignment, and local rules may approximate its computational principles.&#x27;, meaning:&#x27;It replaces the claim that BP is simply impossible with a set of testable dimensions, providing a common audit framework for the roadmap.&#x27;, caveat:&#x27;The possible implementation of BP-like principles does not mean that exact BP has been demonstrated by neural data.&#x27;, fit:&#x27;Overview essential&#x27;, prereqs:[&#x27;P041&#x27;], url:&#x27;https://www.nature.com/articles/s41583-020-0277-3&#x27; },
        { id:&#x27;P013&#x27;, stage:2, year:2022, short:&#x27;PC vs BP limits&#x27;, title:&#x27;On the Relationship Between Predictive Coding and Backpropagation&#x27;, authors:&#x27;Rosenbaum · PLOS ONE&#x27;, domain:&#x27;spatial&#x27;, req:&#x27;core&#x27;, summary:&#x27;The paper examines predictive-coding and BP updates in detail, identifying often-overlooked differences and the conditions required for equivalence.&#x27;, meaning:&#x27;It is the necessary critical counterpoint for the PC route, preventing an approximation claim from being restated as intrinsic identity.&#x27;, caveat:&#x27;These theoretical limits do not negate the online or biological value of predictive coding; they constrain overbroad equivalence claims.&#x27;, fit:&#x27;PC critical essential&#x27;, prereqs:[&#x27;P011&#x27;,&#x27;P002&#x27;], url:&#x27;https://pmc.ncbi.nlm.nih.gov/articles/PMC8970408/&#x27; },

        { id:&#x27;P018&#x27;, stage:3, year:2020, short:&#x27;e-prop&#x27;, title:&#x27;A Solution to the Learning Dilemma for Recurrent Networks of Spiking Neurons&#x27;, authors:&#x27;Bellec et al. · Nature Communications&#x27;, domain:&#x27;spiking&#x27;, req:&#x27;core&#x27;, summary:&#x27;E-prop factors recurrent-SNN gradients into synapse-local eligibility traces and learning signals available at the current time, avoiding storage of the full history required by BPTT.&#x27;, meaning:&#x27;It is one of the causal online SNN methods in this roadmap that can move directly onto the two-week project shortlist.&#x27;, caveat:&#x27;Hidden layers still receive broadcast learning signals, and the method relies on surrogate-gradient or model assumptions; online learning does not imply resistance to forgetting.&#x27;, fit:&#x27;Project candidate&#x27;, prereqs:[&#x27;P024&#x27;,&#x27;P002&#x27;], url:&#x27;https://www.nature.com/articles/s41467-020-17236-y&#x27; },
        { id:&#x27;P019&#x27;, stage:3, year:2020, short:&#x27;DECOLLE&#x27;, title:&#x27;Synaptic Plasticity Dynamics for Deep Continuous Local Learning&#x27;, authors:&#x27;Kaiser, Mostafa &amp; Neftci · Frontiers in Neuroscience&#x27;, domain:&#x27;spiking&#x27;, req:&#x27;branch&#x27;, summary:&#x27;Each layer uses a fixed random local readout and an instantaneous local loss, enabling a deep SNN to update continuously without retaining temporal gradient histories.&#x27;, meaning:&#x27;It offers a clearly specified, layer-local engineering route and a useful comparison with e-prop on spatial locality versus global task credit.&#x27;, caveat:&#x27;Auxiliary classifiers inject targets into each layer; a local loss does not show that a biological system naturally supplies that target.&#x27;, fit:&#x27;Optional implementation&#x27;, prereqs:[&#x27;P036&#x27;,&#x27;P002&#x27;], url:&#x27;https://www.frontiersin.org/journals/neuroscience/articles/10.3389/fnins.2020.00424/full&#x27; },
        { id:&#x27;P042&#x27;, stage:3, year:2022, short:&#x27;OSTL&#x27;, title:&#x27;Online Spatio-Temporal Learning in Deep Neural Networks&#x27;, authors:&#x27;Bohnstingl et al. · IEEE TNNLS&#x27;, domain:&#x27;spiking&#x27;, req:&#x27;branch&#x27;, summary:&#x27;OSTL explicitly separates spatial and temporal gradient components; for shallow SNNs it can yield online gradients equivalent to BPTT and it extends to more general recurrent networks.&#x27;, meaning:&#x27;It directly exposes spatial credit and temporal credit as distinct design dimensions.&#x27;, caveat:&#x27;Deep extensions require approximations or additional complexity, and not every variant is strictly local in the biological sense.&#x27;, fit:&#x27;Theory comparison&#x27;, prereqs:[&#x27;P018&#x27;], url:&#x27;https://doi.org/10.1109/TNNLS.2022.3153985&#x27; },
        { id:&#x27;P022&#x27;, stage:3, year:2022, short:&#x27;OTTT&#x27;, title:&#x27;Online Training Through Time for Spiking Neural Networks&#x27;, authors:&#x27;Xiao et al. · NeurIPS&#x27;, domain:&#x27;spiking&#x27;, req:&#x27;branch&#x27;, summary:&#x27;OTTT carries presynaptic activity forward through time and updates the SNN from instantaneous losses and gradients, keeping training memory constant with respect to the number of time steps.&#x27;, meaning:&#x27;It supplies a performance- and memory-oriented online SNN comparator and expresses the update in a three-factor form.&#x27;, caveat:&#x27;The method still uses surrogate gradients and supervised losses; a three-factor form is not complete evidence of biological plausibility.&#x27;, fit:&#x27;Performance comparator&#x27;, prereqs:[&#x27;P018&#x27;], url:&#x27;https://openreview.net/forum?id=Siv3nHYHheI&#x27; },
        { id:&#x27;P020&#x27;, stage:3, year:2025, short:&#x27;S-TLLR&#x27;, title:&#x27;S-TLLR: STDP-Inspired Temporal Local Learning Rule for Spiking Neural Networks&#x27;, authors:&#x27;Marco P. E. Apolinario · TMLR · 2025&#x27;, domain:&#x27;spiking&#x27;, req:&#x27;frontier&#x27;, summary:&#x27;S-TLLR uses STDP-inspired pre- and postsynaptic timing terms to construct temporally local updates for deep SNNs, with memory and time complexity independent of sequence length.&#x27;, meaning:&#x27;It is a recent candidate for a low-memory causal online implementation.&#x27;, caveat:&#x27;Its spatial error signals and surrogate-gradient assumptions still require scrutiny; a frontier result should not be treated as independently replicated.&#x27;, fit:&#x27;Recent candidate&#x27;, prereqs:[&#x27;P036&#x27;,&#x27;P018&#x27;], url:&#x27;https://openreview.net/forum?id=CNaiJRcX84&#x27; },
        { id:&#x27;P043&#x27;, stage:3, year:2025, short:&#x27;e-prop neural fit&#x27;, title:&#x27;Can Biologically Plausible Temporal Credit Assignment Rules Match BPTT for Neural Similarity?&#x27;, authors:&#x27;Liu, Yang &amp; Cueva · ICML&#x27;, domain:&#x27;spiking&#x27;, req:&#x27;frontier&#x27;, summary:&#x27;After matching task accuracy, the paper compares the neural-representation similarity of e-prop and BPTT models and finds that architecture and initialization may dominate differences attributed to the learning rule.&#x27;, meaning:&#x27;It extends evaluation from task performance to neural-data fit, providing a critical control for interpreting e-prop.&#x27;, caveat:&#x27;It does not establish e-prop as the unique or actual brain rule; the findings depend on the matching design and neural data used.&#x27;, fit:&#x27;Critical essential&#x27;, prereqs:[&#x27;P018&#x27;], url:&#x27;https://proceedings.mlr.press/v267/liu25cl.html&#x27; },

        { id:&#x27;P044&#x27;, stage:4, year:2022, short:&#x27;Three incremental regimes&#x27;, title:&#x27;Three Types of Incremental Learning&#x27;, authors:&#x27;van de Ven, Tuytelaars &amp; Tolias · Nature Machine Intelligence&#x27;, domain:&#x27;continual&#x27;, req:&#x27;core&#x27;, summary:&#x27;The paper distinguishes task-, domain-, and class-incremental learning, emphasizing that task identity at test time and expansion of the output space change both difficulty and method rankings.&#x27;, meaning:&#x27;Freeze the protocol before implementation; otherwise an apparent reduction in forgetting may simply reflect access to more task information.&#x27;, caveat:&#x27;This is an evaluation framework, not a biological learning rule.&#x27;, fit:&#x27;Protocol essential&#x27;, prereqs:[&#x27;P034&#x27;], url:&#x27;https://www.nature.com/articles/s42256-022-00568-3&#x27; },
        { id:&#x27;P001&#x27;, stage:4, year:2022, short:&#x27;Biological lifelong learning&#x27;, title:&#x27;Biological Underpinnings for Lifelong Learning Machines&#x27;, authors:&#x27;Kudithipudi et al. · Nature Machine Intelligence&#x27;, domain:&#x27;continual&#x27;, req:&#x27;branch&#x27;, summary:&#x27;This review surveys neuronal and non-neuronal biological mechanisms relevant to lifelong learning.&#x27;, meaning:&#x27;It extends biological plausibility from a single weight update to the broader problem of long-term stability.&#x27;, caveat:&#x27;The review presents complementary mechanisms; it does not imply that one algorithm implements every capability at once.&#x27;, fit:&#x27;Overview optional&#x27;, prereqs:[&#x27;P033&#x27;,&#x27;P034&#x27;], url:&#x27;https://www.nature.com/articles/s42256-022-00452-0&#x27; },
        { id:&#x27;P016&#x27;, stage:4, year:2022, short:&#x27;Lifelong neural PC&#x27;, title:&#x27;Lifelong Neural Predictive Coding: Learning Cumulatively Online without Forgetting&#x27;, authors:&#x27;Ororbia et al. · NeurIPS&#x27;, domain:&#x27;continual&#x27;, req:&#x27;core&#x27;, summary:&#x27;The Sequential Neural Coding Network combines predictive coding, local weight updates, and executive-control structures to learn cumulatively from a task-free data stream.&#x27;, meaning:&#x27;It is the core bridge from predictive coding directly into online continual learning.&#x27;, caveat:&#x27;The system includes lateral competition and control mechanisms, so its performance should not be attributed entirely to one local learning equation.&#x27;, fit:&#x27;PC candidate&#x27;, prereqs:[&#x27;P011&#x27;,&#x27;P044&#x27;], url:&#x27;https://openreview.net/forum?id=ccYOWWNa5v2&#x27; },
        { id:&#x27;P045&#x27;, stage:4, year:2023, short:&#x27;Spiking predictive coding&#x27;, title:&#x27;Spiking Neural Predictive Coding for Continually Learning from Data Streams&#x27;, authors:&#x27;Ororbia · Neurocomputing&#x27;, domain:&#x27;continual&#x27;, req:&#x27;core&#x27;, summary:&#x27;The system implements continual guess-and-check predictive coding with LIF units, obtains local synaptic updates, and tests forgetting across task sequences.&#x27;, meaning:&#x27;It places predictive coding, SNNs, local updates, and continual data streams in one system, making it a central cross-domain node for the project.&#x27;, caveat:&#x27;The evidence comes from one research line and specific benchmarks; it should be rechecked against simple baselines under matched budgets.&#x27;, fit:&#x27;Cross-domain essential&#x27;, prereqs:[&#x27;P018&#x27;,&#x27;P016&#x27;], url:&#x27;https://www.sciencedirect.com/science/article/pii/S0925231223004150&#x27; },
        { id:&#x27;P046&#x27;, stage:4, year:2023, short:&#x27;Online CL evaluation&#x27;, title:&#x27;A Comprehensive Empirical Evaluation on Online Continual Learning&#x27;, authors:&#x27;Soutif-Cormerais et al. · ICCV Workshop&#x27;, domain:&#x27;continual&#x27;, req:&#x27;core&#x27;, summary:&#x27;The study compares online continual-learning methods using average accuracy, forgetting, stability, and representation quality.&#x27;, meaning:&#x27;It provides a set of evaluation dimensions and a comparison framework that the project can adopt.&#x27;, caveat:&#x27;Computer-vision benchmarks are not biological mechanisms; borrow the evaluation discipline, not necessarily the full scope.&#x27;, fit:&#x27;Evaluation essential&#x27;, prereqs:[&#x27;P044&#x27;], url:&#x27;https://openaccess.thecvf.com/content/ICCV2023W/VCL/html/Soutif-Cormerais_A_Comprehensive_Empirical_Evaluation_on_Online_Continual_Learning_ICCVW_2023_paper.html&#x27; },
        { id:&#x27;P007&#x27;, stage:4, year:2024, short:&#x27;Loss of plasticity&#x27;, title:&#x27;Loss of Plasticity in Deep Continual Learning&#x27;, authors:&#x27;Dohare et al. · Nature&#x27;, domain:&#x27;continual&#x27;, req:&#x27;core&#x27;, summary:&#x27;The paper shows that deep networks can gradually lose the ability to learn new information during long non-stationary training; Continual Backprop replaces low-utility units to preserve representational diversity.&#x27;, meaning:&#x27;It requires the project to ask whether a model can still learn new tasks, not only whether it remembers old ones.&#x27;, caveat:&#x27;The proposed remedy is not a synapse-local biological rule; it serves here as a problem definition and an engineering baseline.&#x27;, fit:&#x27;Metric essential&#x27;, prereqs:[&#x27;P034&#x27;,&#x27;P044&#x27;,&#x27;P046&#x27;], url:&#x27;https://www.nature.com/articles/s41586-024-07711-7&#x27; },
        { id:&#x27;P014&#x27;, stage:5, year:2024, short:&#x27;Prospective configuration&#x27;, title:&#x27;Inferring Neural Activity Before Plasticity as a Foundation for Learning Beyond Backpropagation&#x27;, authors:&#x27;Song et al. · Nature Neuroscience&#x27;, domain:&#x27;continual&#x27;, req:&#x27;frontier&#x27;, summary:&#x27;The method first changes neural activity under target constraints and then consolidates that configuration into weights; the paper tests the principle in batch-one, changing-environment, and continual settings.&#x27;, meaning:&#x27;It is a direct recent bridge from predictive-coding or energy-based routes to online learning and stability goals.&#x27;, caveat:&#x27;The reported advantages arise from the authors’ combined model and protocol; a two-week project should reproduce a small-scale phenomenon rather than claim general superiority to BP.&#x27;, fit:&#x27;PC candidate&#x27;, prereqs:[&#x27;P011&#x27;,&#x27;P013&#x27;,&#x27;P044&#x27;], url:&#x27;https://www.nature.com/articles/s41593-023-01514-1&#x27; },

        { id:&#x27;P047&#x27;, stage:5, year:2024, short:&#x27;Phaseless alignment&#x27;, title:&#x27;Learning Efficient Backprojections Across Cortical Hierarchies in Real Time&#x27;, authors:&#x27;Max et al. · Nature Machine Intelligence&#x27;, domain:&#x27;spatial&#x27;, req:&#x27;frontier&#x27;, summary:&#x27;The method uses continuously present biological noise to learn feedback projections, keeping forward and feedback synapses plastic without separate, rigid forward and backward phases.&#x27;, meaning:&#x27;It jointly addresses weight transport, phase locking, and real-time local updates.&#x27;, caveat:&#x27;The continuous-time microcircuit is complex and high-risk as the primary two-week implementation; it is better used to define audit dimensions.&#x27;, fit:&#x27;Future work&#x27;, prereqs:[&#x27;P025&#x27;,&#x27;P002&#x27;], url:&#x27;https://www.nature.com/articles/s42256-024-00845-3&#x27; },
        { id:&#x27;P048&#x27;, stage:5, year:2025, short:&#x27;Dendritic localized learning&#x27;, title:&#x27;Dendritic Localized Learning: Toward Biologically Plausible Algorithm&#x27;, authors:&#x27;Lv et al. · ICML&#x27;, domain:&#x27;spatial&#x27;, req:&#x27;frontier&#x27;, summary:&#x27;Inspired by pyramidal-neuron dendritic dynamics, DLL addresses asymmetric feedback, local errors, and training without two separate phases, with comparisons across MLPs, CNNs, and RNNs.&#x27;, meaning:&#x27;It indicates that spatial-credit alternatives are moving toward scalable methods that apply across architectures.&#x27;, caveat:&#x27;The paper’s three criteria do not constitute complete biological plausibility, and online continual evidence is not its primary focus.&#x27;, fit:&#x27;Spatial frontier&#x27;, prereqs:[&#x27;P039&#x27;,&#x27;P002&#x27;], url:&#x27;https://proceedings.mlr.press/v267/lv25c.html&#x27; },
        { id:&#x27;P049&#x27;, stage:5, year:2026, short:&#x27;AGMP&#x27;, title:&#x27;Astrocyte-Gated Multi-Timescale Plasticity for Online Continual Learning in Deep Spiking Neural Networks&#x27;, authors:&#x27;Dong &amp; He · Frontiers in Neuroscience · 2026-01-27 (volume/DOI 2025)&#x27;, domain:&#x27;frontier&#x27;, req:&#x27;frontier&#x27;, summary:&#x27;The method combines an astrocyte-mediated gate with eligibility traces and a broadcast teaching signal, and evaluates the combination in online continual-learning settings.&#x27;, meaning:&#x27;It is the roadmap’s project-aligned endpoint for combining online learning, continual retention, eligibility traces, and multiple timescales.&#x27;, caveat:&#x27;It still uses a globally broadcast signal and is one very recent study; treat it as a testable proposal, not a field-wide conclusion.&#x27;, fit:&#x27;Endpoint / critique target&#x27;, prereqs:[&#x27;P018&#x27;,&#x27;P044&#x27;,&#x27;P007&#x27;], url:&#x27;https://www.frontiersin.org/journals/neuroscience/articles/10.3389/fnins.2025.1768235/full&#x27; },
        { id:&#x27;P050&#x27;, stage:5, year:2026, short:&#x27;Generalized latent equilibrium&#x27;, title:&#x27;Backpropagation Through Space, Time and the Brain&#x27;, authors:&#x27;Ellenberger et al. · Nature Communications 17:66 (online 2025-12-26)&#x27;, domain:&#x27;frontier&#x27;, req:&#x27;frontier&#x27;, summary:&#x27;Generalized Latent Equilibrium proposes local, present-time learning rules that approximate BPTT.&#x27;, meaning:&#x27;It places spatial and temporal credit assignment in a unified theory and serves as the roadmap’s conceptual endpoint.&#x27;, caveat:&#x27;The method is complex, very recent, and unsuitable as a first two-week implementation; it also does not directly solve long-term catastrophic forgetting.&#x27;, fit:&#x27;Conceptual endpoint&#x27;, prereqs:[&#x27;P028&#x27;,&#x27;P018&#x27;,&#x27;P047&#x27;], url:&#x27;https://www.nature.com/articles/s41467-025-66666-z&#x27; }
      ];

      const byId = new Map(papers.map(p =&gt; [p.id, p]));
      const mainSpine = [&#x27;P031&#x27;,&#x27;P032&#x27;,&#x27;P034&#x27;,&#x27;P036&#x27;,&#x27;P024&#x27;,&#x27;P026&#x27;,&#x27;P041&#x27;,&#x27;P002&#x27;,&#x27;P018&#x27;,&#x27;P044&#x27;,&#x27;P016&#x27;,&#x27;P045&#x27;,&#x27;P046&#x27;,&#x27;P007&#x27;,&#x27;P049&#x27;];
      const mainPairs = new Set(mainSpine.slice(1).map((id, i) =&gt; `${mainSpine[i]}-${id}`));
      let selectedId = &#x27;P031&#x27;;

      const iconMarkup = name =&gt; `&lt;span aria-hidden=&quot;true&quot;&gt;${name === &#x27;circle-check-big&#x27; ? &#x27;●&#x27; : name === &#x27;sparkles&#x27; ? &#x27;✦&#x27; : &#x27;↗&#x27;}&lt;/span&gt;`;

      stages.forEach(stage =&gt; {
        const section = document.createElement(&#x27;section&#x27;);
        section.className = &#x27;stage&#x27;;
        section.setAttribute(&#x27;aria-label&#x27;, stage.label);
        section.innerHTML = `
          &lt;div class=&quot;stage-head&quot;&gt;
            &lt;div class=&quot;stage-label&quot;&gt;&lt;span class=&quot;stage-number&quot;&gt;${stage.id + 1}&lt;/span&gt;&lt;span&gt;${stage.label}&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;stage-meta text-small text-muted&quot;&gt;&lt;span&gt;${stage.size}&lt;/span&gt;&lt;span&gt;·&lt;/span&gt;&lt;span&gt;${stage.note}&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;stage-grid&quot;&gt;&lt;/div&gt;`;
        const grid = section.querySelector(&#x27;.stage-grid&#x27;);
        papers.filter(p =&gt; p.stage === stage.id).forEach(paper =&gt; {
          const domain = domains[paper.domain];
          const req = requirements[paper.req];
          const button = document.createElement(&#x27;button&#x27;);
          button.type = &#x27;button&#x27;;
          button.className = &#x27;btn viz-tile paper-node&#x27;;
          button.id = `bp-node-${paper.id}`;
          button.dataset.paperId = paper.id;
          button.style.setProperty(&#x27;--series&#x27;, domain.color);
          button.setAttribute(&#x27;aria-label&#x27;, `${paper.id} ${paper.short}, ${paper.year}, ${domain.label}, ${req.label}`);
          button.setAttribute(&#x27;aria-pressed&#x27;, &#x27;false&#x27;);
          button.innerHTML = `
            &lt;span class=&quot;node-meta text-small&quot;&gt;
              &lt;span&gt;${paper.id} · ${paper.year}&lt;/span&gt;
              &lt;span class=&quot;requirement-icon&quot;&gt;${iconMarkup(req.icon)}&lt;span class=&quot;sr-only&quot;&gt;${req.label}&lt;/span&gt;&lt;/span&gt;
            &lt;/span&gt;
            &lt;span class=&quot;node-title&quot;&gt;${paper.short}&lt;/span&gt;`;
          button.addEventListener(&#x27;click&#x27;, () =&gt; selectPaper(paper.id));
          grid.appendChild(button);
        });
        stageContainer.appendChild(section);
      });

      function selectPaper(id) {
        const paper = byId.get(id);
        if (!paper) return;
        selectedId = id;
        root.querySelectorAll(&#x27;.paper-node&#x27;).forEach(node =&gt; {
          const selected = node.dataset.paperId === id;
          node.classList.toggle(&#x27;is-selected&#x27;, selected);
          node.setAttribute(&#x27;aria-pressed&#x27;, selected ? &#x27;true&#x27; : &#x27;false&#x27;);
        });
        const domain = domains[paper.domain];
        const req = requirements[paper.req];
        root.querySelector(&#x27;#bp-detail-meta&#x27;).innerHTML = `
          &lt;span class=&quot;domain-swatch&quot; style=&quot;--series:${domain.color}&quot;&gt;&lt;/span&gt;
          &lt;span&gt;${domain.label}&lt;/span&gt;&lt;span&gt;·&lt;/span&gt;
          &lt;span&gt;${iconMarkup(req.icon)} ${req.label}&lt;/span&gt;&lt;span&gt;·&lt;/span&gt;
          &lt;span&gt;${paper.id} · ${paper.year}&lt;/span&gt;`;
        root.querySelector(&#x27;#bp-detail-title&#x27;).textContent = paper.title;
        root.querySelector(&#x27;#bp-detail-authors&#x27;).textContent = paper.authors;
        root.querySelector(&#x27;#bp-detail-fit&#x27;).textContent = paper.fit;
        root.querySelector(&#x27;#bp-detail-summary&#x27;).textContent = paper.summary;
        root.querySelector(&#x27;#bp-detail-meaning&#x27;).textContent = paper.meaning;
        root.querySelector(&#x27;#bp-detail-caveat&#x27;).textContent = paper.caveat;
        root.querySelector(&#x27;#bp-detail-prereqs&#x27;).textContent = paper.prereqs.length
          ? paper.prereqs.map(pid =&gt; `${pid} ${byId.get(pid)?.short || &#x27;&#x27;}`).join(&#x27; → &#x27;)
          : &#x27;None; start here.&#x27;;
        root.querySelector(&#x27;#bp-detail-order&#x27;).textContent = mainSpine.includes(id)
          ? `Core spine stop ${mainSpine.indexOf(id) + 1} of ${mainSpine.length}`
          : &#x27;Mechanism branch / frontier supplement&#x27;;
        root.querySelector(&#x27;#bp-detail-link&#x27;).href = paper.url;
        if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
        queueDraw();
      }

      function drawEdges() {
        const wrapRect = mapWrap.getBoundingClientRect();
        const width = mapWrap.clientWidth;
        const height = mapWrap.clientHeight;
        edgeLayer.setAttribute(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`);
        edgeLayer.setAttribute(&#x27;width&#x27;, width);
        edgeLayer.setAttribute(&#x27;height&#x27;, height);
        edgeLayer.innerHTML = &#x27;&#x27;;

        const visibleEdges = new Map();
        mainSpine.slice(1).forEach((childId, i) =&gt; {
          const parentId = mainSpine[i];
          visibleEdges.set(`${parentId}-${childId}`, { parentId, childId, main: true });
        });
        const selected = byId.get(selectedId);
        if (selected) selected.prereqs.forEach(parentId =&gt; {
          const key = `${parentId}-${selected.id}`;
          if (!visibleEdges.has(key)) visibleEdges.set(key, { parentId, childId: selected.id, main: false });
        });

        visibleEdges.forEach(({ parentId, childId, main }) =&gt; {
            const parent = root.querySelector(`#bp-node-${parentId}`);
            const child = root.querySelector(`#bp-node-${childId}`);
            if (!parent || !child) return;
            const a = parent.getBoundingClientRect();
            const b = child.getBoundingClientRect();
            const path = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;path&#x27;);
            const sameRow = Math.abs(a.top - b.top) &lt; 12;
            if (sameRow) {
              const leftToRight = a.left &lt; b.left;
              const x1 = (leftToRight ? a.right : a.left) - wrapRect.left;
              const x2 = (leftToRight ? b.left : b.right) - wrapRect.left;
              const y1 = a.top + a.height / 2 - wrapRect.top;
              const y2 = b.top + b.height / 2 - wrapRect.top;
              const bend = Math.max(14, Math.abs(x2 - x1) * 0.42);
              path.setAttribute(&#x27;d&#x27;, `M ${x1} ${y1} C ${x1 + (leftToRight ? bend : -bend)} ${y1}, ${x2 - (leftToRight ? bend : -bend)} ${y2}, ${x2} ${y2}`);
            } else {
              const x1 = a.left + a.width / 2 - wrapRect.left;
              const y1 = a.bottom - wrapRect.top;
              const x2 = b.left + b.width / 2 - wrapRect.left;
              const y2 = b.top - wrapRect.top;
              const distance = Math.max(18, Math.abs(y2 - y1) * 0.45);
              path.setAttribute(&#x27;d&#x27;, `M ${x1} ${y1} C ${x1} ${y1 + distance}, ${x2} ${y2 - distance}, ${x2} ${y2}`);
            }
            path.setAttribute(&#x27;class&#x27;, `edge${main || mainPairs.has(`${parentId}-${childId}`) ? &#x27; main&#x27; : &#x27;&#x27;}`);
            edgeLayer.appendChild(path);
        });
      }

      let resizeFrame = 0;
      const queueDraw = () =&gt; {
        cancelAnimationFrame(resizeFrame);
        resizeFrame = requestAnimationFrame(drawEdges);
      };

      selectPaper(&#x27;P031&#x27;);
      if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
      queueDraw();
      window.addEventListener(&#x27;resize&#x27;, queueDraw, { passive: true });
      if (document.fonts &amp;&amp; document.fonts.ready) document.fonts.ready.then(queueDraw);
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;/body&gt;
&lt;/html&gt;
"></iframe>
