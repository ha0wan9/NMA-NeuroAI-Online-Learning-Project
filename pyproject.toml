[project]
name = "nma-neuroai-online-learning"
version = "0.1.0"
description = "Reproducible experiment harness for the NMA NeuroAI online-learning project"
requires-python = ">=3.11,<3.12"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "seaborn>=0.13",
  "tqdm>=4.66",
]

[project.optional-dependencies]
cpu = [
  "torch==2.10.0",
  "torchvision==0.25.0",
]
cuda = [
  "torch==2.10.0",
  "torchvision==0.25.0",
]

[tool.uv]
package = false
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cuda" },
  ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cuda" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cuda" },
]
